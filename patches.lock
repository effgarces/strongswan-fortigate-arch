# Pinned FortiGate patches for strongSwan (from Noneawe/strongswan-deb-build).
# Nothing from that repo is copied here: scripts/fetch-patches.sh downloads
# each patch from the pinned commit and refuses to continue if a SHA-512
# does not match.  To move to a newer commit run scripts/update-lock.sh and
# READ THE DIFF it shows before committing.
#
# PATCH_REV is appended to Arch's pkgrel (2 -> 2.<rev>).  Bump it whenever
# this repo's build logic or the pinned patches change but Arch's version
# does not, so a new release is produced.
