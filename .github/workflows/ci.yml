name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh tests/*.sh
        continue-on-error: true   # advisory
      - run: python3 -m py_compile scripts/patch-pkgbuild.py
      - run: tests/run.sh
